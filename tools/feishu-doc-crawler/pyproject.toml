[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyinta-feishu-doc-crawler"
version = "0.1.0"
description = "Crawl4AI adapter for Feishu/Doubao minutes documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "crawl4ai==0.9.2",
]

[project.scripts]
feishu-doc-crawl = "feishu_doc_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
